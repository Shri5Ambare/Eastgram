name: Reviewed dependency migration
on:
  push:
    branches: [codex/security-foundation]
    paths: [.github/workflows/dependency-repair.yml, package.json]
concurrency:
  group: dependency-migration
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'Shri5Ambare/Eastgram'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eastgram
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: eastgram_security_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eastgram -d eastgram_security_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://eastgram:integration-only-password@localhost:5432/eastgram_security_test
      TEST_HTTP_BOOT: 'true'
      TEST_DATABASE_URL: postgresql://eastgram:integration-only-password@localhost:5432/eastgram_security_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/security-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Resolve reviewed migration versions
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Record resolved versions
        run: npm ls @nestjs/core @nestjs/jwt @nestjs/config firebase-admin jest typescript
      - name: Record remaining advisories
        run: |
          npm audit --json > audit.json || true
          node -e "const a=require('./audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(JSON.stringify({name,severity:v.severity,fixAvailable:v.fixAvailable,via:v.via})); console.log(JSON.stringify(a.metadata));"
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
      - name: Build single-school production application
        run: npm run build
      - run: node --test test/post-policy.node.test.cjs
      - run: npm test -- --runInBand
      - name: Commit only the tested lockfile to the repair branch
        run: |
          git fetch origin codex/security-foundation
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/codex/security-foundation)"
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Lock reviewed framework migration after regression checks"
            git push origin HEAD:codex/security-foundation
          fi
