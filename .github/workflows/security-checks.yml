name: Security regression checks
on:
  pull_request:
  push:
    branches: [master, codex/security-foundation]
permissions:
  contents: read
jobs:
  backend-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
          redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
          POSTGRES_USER: eastgram
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: eastgram_security_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eastgram -d eastgram_security_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://eastgram:integration-only-password@localhost:5432/eastgram_security_test
      TEST_HTTP_BOOT: 'true'
      TEST_DATABASE_URL: postgresql://eastgram:integration-only-password@localhost:5432/eastgram_security_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Dependency audit details
        run: |
          npm audit --json > audit.json || true
          node -e "const a=require('./audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(JSON.stringify({name,severity:v.severity,fixAvailable:v.fixAvailable,via:v.via})); console.log(JSON.stringify(a.metadata));"
          npm audit --omit=dev --json > production-audit.json || true
          node -e "const a=require('./production-audit.json'); console.log('Production dependency audit:', JSON.stringify(a.metadata));"
      - run: npx prisma generate
      # This database is a disposable service created above; never production.
      - run: npx prisma db push --skip-generate
      - run: npm run build
      - run: node --test test/post-policy.node.test.cjs
      - run: npm test -- --runInBand
